    <line x1="28" y1="0.6" x2="458" y2="0.6" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />

    <!-- Badge -->
    <rect x="24" y="22" width="206" height="24" rx="12" fill="#271F14" stroke="#FF9F0A" stroke-opacity="0.38" stroke-width="1" />
    <circle cx="38" cy="34" r="3.5" fill="#FF9F0A" class="live-dot" />
