<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0E12" />
      <stop offset="100%" stop-color="#13141B" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#2997FF" stop-opacity="0.16" />
    </linearGradient>

    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2997FF" />
      <stop offset="100%" stop-color="#64D2FF" />
    </linearGradient>

    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30D158" />
      <stop offset="100%" stop-color="#64D2FF" />
    </linearGradient>

    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5E5CE6" />
      <stop offset="100%" stop-color="#BF5AF2" />
    </linearGradient>

    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9F0A" />
      <stop offset="100%" stop-color="#FFD60A" />
    </linearGradient>

    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      .live-dot {
        animation: pulseDot 2.5s ease-in-out infinite;
      }
      .sparkline {
        stroke-dasharray: 240;
        animation: dashFlow 4.5s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <!-- CARD 1: ADASTRA / WEBANK (Top Left) -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="486" height="202" rx="20" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" />
    <line x1="28" y1="0.6" x2="458" y2="0.6" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />

    <!-- Badge -->
    <rect x="24" y="22" width="184" height="24" rx="12" fill="#172130" stroke="#2997FF" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="38" cy="34" r="3.5" fill="#2997FF" class="live-dot" />
    <text x="48" y="38" fill="#64D2FF" font-size="10.5" font-weight="600" letter-spacing="0.4" class="font-mono">FINTECHATHON 2026 · ML</text>

    <!-- Sparkline top right -->
    <path d="M 350 42 C 375 40, 392 30, 412 32 C 430 34, 442 20, 462 18" fill="none" stroke="url(#greenAccent)" stroke-width="2" stroke-linecap="round" class="sparkline" />
    <text x="394" y="54" fill="#30D158" font-size="10" font-weight="600" class="font-mono">+14.02% Alpha</text>

    <!-- Title & Description -->
    <text x="24" y="76" fill="#FFFFFF" font-size="20" font-weight="700" letter-spacing="-0.4" class="font-sans">
      Adastra — Quantitative Risk &amp; ML Cockpit
    </text>
    <text x="24" y="102" fill="#A1A1AA" font-size="12.5" font-weight="400" class="font-sans">
      Cost-sensitive LightGBM pipeline, TreeSHAP explainability &amp; Chinese financial
    </text>
    <text x="24" y="121" fill="#A1A1AA" font-size="12.5" font-weight="400" class="font-sans">
      news NLP for China A-Shares portfolio allocation under CSRC suitability rules.
    </text>

    <!-- Tech Stack Pills -->
    <g transform="translate(24, 152)">
      <rect x="0" y="0" width="76" height="26" rx="8" fill="#181922" stroke="#FFFFFF" stroke-opacity="0.08" />
      <text x="38" y="17" text-anchor="middle" fill="#E5E5EA" font-size="11" font-weight="500" class="font-mono">LightGBM</text>

      <rect x="84" y="0" width="80" height="26" rx="8" fill="#181922" stroke="#FFFFFF" stroke-opacity="0.08" />
      <text x="124" y="17" text-anchor="middle" fill="#E5E5EA" font-size="11" font-weight="500" class="font-mono">TreeSHAP</text>

      <rect x="172" y="0" width="68" height="26" rx="8" fill="#181922" stroke="#FFFFFF" stroke-opacity="0.08" />
      <text x="206" y="17" text-anchor="middle" fill="#E5E5EA" font-size="11" font-weight="500" class="font-mono">FastAPI</text>

      <rect x="248" y="0" width="66" height="26" rx="8" fill="#181922" stroke="#FFFFFF" stroke-opacity="0.08" />
      <text x="281" y="17" text-anchor="middle" fill="#E5E5EA" font-size="11" font-weight="500" class="font-mono">React 18</text>

      <rect x="322" y="0" width="64" height="26" rx="8" fill="#181922" stroke="#FFFFFF" stroke-opacity="0.08" />
      <text x="354" y="17" text-anchor="middle" fill="#E5E5EA" font-size="11" font-weight="500" class="font-mono">Quarto</text>
    </g>
  </g>

