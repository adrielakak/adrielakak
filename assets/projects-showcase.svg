<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif; }
      .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace; }
    </style>
  </defs>

  <!-- CARD 1: Adastra (Hackathon FinTechathon 2026) -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="484" height="182" rx="14" fill="#080808" stroke="#1F1F1F" stroke-width="1.2"/>

    <text x="26" y="34" class="mono" font-size="10.5" fill="#71717A" letter-spacing="0.8">FINTECHATHON 2026 · SHENZHEN UNIVERSITY</text>
    <path d="M 388 34 C 408 32, 424 24, 456 18" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"/>

    <text x="26" y="64" class="sans" font-size="19" font-weight="600" fill="#FFFFFF" letter-spacing="-0.3">Adastra — Quantitative Risk &amp; ML</text>
    <text x="26" y="92" class="sans" font-size="13" fill="#A1A1AA">Explainable gradient boosting (LightGBM + TreeSHAP)</text>
    <text x="26" y="112" class="sans" font-size="13" fill="#A1A1AA">&amp; financial NLP for China A-Shares allocation.</text>

    <g transform="translate(26, 136)">
      <rect x="0" y="0" width="76" height="24" rx="6" fill="#111111" stroke="#262626" stroke-width="1"/>
      <text x="38" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#D4D4D8">LightGBM</text>

      <rect x="84" y="0" width="76" height="24" rx="6" fill="#111111" stroke="#262626" stroke-width="1"/>
      <text x="122" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#D4D4D8">TreeSHAP</text>

      <rect x="168" y="0" width="68" height="24" rx="6" fill="#111111" stroke="#262626" stroke-width="1"/>
      <text x="202" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#D4D4D8">FastAPI</text>

      <rect x="244" y="0" width="58" height="24" rx="6" fill="#111111" stroke="#262626" stroke-width="1"/>
      <text x="273" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#D4D4D8">React</text>
    </g>
  </g>

  <!-- CARD 2: Train DB (SZU SQL Database Project) -->
  <g transform="translate(512, 4)">
    <rect x="0" y="0" width="484" height="182" rx="14" fill="#080808" stroke="#1F1F1F" stroke-width="1.2"/>

    <text x="26" y="34" class="mono" font-size="10.5" fill="#71717A" letter-spacing="0.8">RELATIONAL DATABASE · SQL ARCHITECTURE</text>
    <path d="M 388 32 C 410 30, 430 25, 456 20" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"/>

    <text x="26" y="64" class="sans" font-size="19" font-weight="600" fill="#FFFFFF" letter-spacing="-0.3">Train DB — Railway SQL System</text>
    <text x="26" y="92" class="sans" font-size="13" fill="#A1A1AA">Conceptual &amp; physical schema modeling (ERD/MLD)</text>
    <text x="26" y="112" class="sans" font-size="13" fill="#A1A1AA">with multi-join SQL queries &amp; data quality audit.</text>

    <g transform="translate(26, 136)">
      <rect x="0" y="0" width="84" height="24" rx="6" fill="#111111" stroke="#262626" stroke-width="1"/>
      <text x="42" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#D4D4D8">PostgreSQL</text>

      <rect x="92" y="0" width="52" height="24" rx="6" fill="#111111" stroke="#262626" stroke-width="1"/>
      <text x="118" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#D4D4D8">SQL</text>

      <rect x="152" y="0" width="78" height="24" rx="6" fill="#111111" stroke="#262626" stroke-width="1"/>
      <text x="191" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#D4D4D8">ERD / MLD</text>

      <rect x="238" y="0" width="82" height="24" rx="6" fill="#111111" stroke="#262626" stroke-width="1"/>
      <text x="279" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#D4D4D8">Data Audit</text>
    </g>
  </g>

  <!-- CARD 3: Electoral Data Analysis (2002-2022) -->
  <g transform="translate(4, 202)">
    <rect x="0" y="0" width="484" height="182" rx="14" fill="#080808" stroke="#1F1F1F" stroke-width="1.2"/>

    <text x="26" y="34" class="mono" font-size="10.5" fill="#71717A" letter-spacing="0.8">STATISTICAL &amp; GEOSPATIAL DATA SCIENCE</text>
    <path d="M 388 33 C 412 29, 432 24, 456 19" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"/>

    <text x="26" y="64" class="sans" font-size="19" font-weight="600" fill="#FFFFFF" letter-spacing="-0.3">Electoral Dynamics (2002–2022)</text>
    <text x="26" y="92" class="sans" font-size="13" fill="#A1A1AA">20-year department-level study of voter turnout,</text>
    <text x="26" y="112" class="sans" font-size="13" fill="#A1A1AA">abstention mapping &amp; political realignment.</text>

    <g transform="translate(26, 136)">
      <rect x="0" y="0" width="64" height="24" rx="6" fill="#111111" stroke="#262626" stroke-width="1"/>
      <text x="32" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#D4D4D8">Python</text>

      <rect x="72" y="0" width="64" height="24" rx="6" fill="#111111" stroke="#262626" stroke-width="1"/>
      <text x="104" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#D4D4D8">Pandas</text>

      <rect x="144" y="0" width="60" height="24" rx="6" fill="#111111" stroke="#262626" stroke-width="1"/>
      <text x="174" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#D4D4D8">Plotly</text>

      <rect x="212" y="0" width="72" height="24" rx="6" fill="#111111" stroke="#262626" stroke-width="1"/>
      <text x="248" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#D4D4D8">GeoJSON</text>
    </g>
  </g>

  <!-- CARD 4: Interactive Portfolio -->
  <g transform="translate(512, 202)">
    <rect x="0" y="0" width="484" height="182" rx="14" fill="#080808" stroke="#1F1F1F" stroke-width="1.2"/>

    <text x="26" y="34" class="mono" font-size="10.5" fill="#71717A" letter-spacing="0.8">INTERACTIVE WEB &amp; DATA PORTFOLIO</text>
    <path d="M 388 33 C 412 28, 434 24, 456 18" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"/>

    <text x="26" y="64" class="sans" font-size="19" font-weight="600" fill="#FFFFFF" letter-spacing="-0.3">Personal Portfolio &amp; Case Studies</text>
    <text x="26" y="92" class="sans" font-size="13" fill="#A1A1AA">Bilingual showcase featuring SQL engineering</text>
    <text x="26" y="112" class="sans" font-size="13" fill="#A1A1AA">reports, interactive charts &amp; full-stack work.</text>

    <g transform="translate(26, 136)">
      <rect x="0" y="0" width="84" height="24" rx="6" fill="#111111" stroke="#262626" stroke-width="1"/>
      <text x="42" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#D4D4D8">JavaScript</text>

      <rect x="92" y="0" width="72" height="24" rx="6" fill="#111111" stroke="#262626" stroke-width="1"/>
      <text x="128" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#D4D4D8">Three.js</text>

      <rect x="172" y="0" width="58" height="24" rx="6" fill="#111111" stroke="#262626" stroke-width="1"/>
      <text x="201" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#D4D4D8">GSAP</text>

      <rect x="238" y="0" width="64" height="24" rx="6" fill="#111111" stroke="#262626" stroke-width="1"/>
      <text x="270" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#D4D4D8">Vercel</text>
    </g>
  </g>
</svg>
