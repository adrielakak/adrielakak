<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0C0C0C"/>
    </linearGradient>

    <linearGradient id="greenArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0.0"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.03"/>
    </pattern>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif; }
      .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace; }

      .curve-line {
        stroke-dasharray: 420;
        stroke-dashoffset: 420;
        animation: drawCurve 3.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .pulse-dot {
        animation: pulse 2.8s ease-in-out infinite;
      }

      @keyframes drawCurve {
        to { stroke-dashoffset: 0; }
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Outer Card -->
  <rect x="2" y="2" width="996" height="276" rx="18" fill="url(#bg)" stroke="#1F1F1F" stroke-width="1.2"/>
  <rect x="2" y="2" width="996" height="276" rx="18" fill="url(#grid)"/>

  <!-- Left Content -->
  <g transform="translate(48, 52)">
    <!-- Academic Pill -->
    <rect x="0" y="0" width="356" height="26" rx="13" fill="#111111" stroke="#262626" stroke-width="1"/>
    <circle cx="15" cy="13" r="3.5" fill="#22C55E" class="pulse-dot"/>
    <text x="28" y="17" class="mono" font-size="11" fill="#A1A1AA" letter-spacing="0.3">Centrale Nantes × Audencia · Shenzhen University</text>

    <!-- Name & Role -->
    <text x="0" y="76" class="sans" font-size="40" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Adriel Kourlate</text>
    <text x="0" y="106" class="sans" font-size="16" font-weight="500" fill="#A1A1AA" letter-spacing="-0.2">Data Science, SQL Architecture &amp; Machine Learning</text>

    <!-- Concise Bio -->
    <text x="0" y="142" class="sans" font-size="13.5" fill="#71717A">Dual-degree Engineering &amp; Management student focused on relational</text>
    <text x="0" y="162" class="sans" font-size="13.5" fill="#71717A">databases, statistical analysis, and explainable machine learning.</text>

    <!-- Minimal Monochrome Tags -->
    <g transform="translate(0, 186)">
      <rect x="0" y="0" width="84" height="26" rx="6" fill="#111111" stroke="#262626" stroke-width="1"/>
      <text x="42" y="17" text-anchor="middle" class="mono" font-size="11" fill="#D4D4D8">Python</text>

      <rect x="94" y="0" width="108" height="26" rx="6" fill="#111111" stroke="#262626" stroke-width="1"/>
      <text x="148" y="17" text-anchor="middle" class="mono" font-size="11" fill="#D4D4D8">SQL · Postgres</text>

      <rect x="212" y="0" width="128" height="26" rx="6" fill="#111111" stroke="#262626" stroke-width="1"/>
      <text x="276" y="17" text-anchor="middle" class="mono" font-size="11" fill="#D4D4D8">LightGBM · SHAP</text>

      <rect x="350" y="0" width="114" height="26" rx="6" fill="#111111" stroke="#262626" stroke-width="1"/>
      <text x="407" y="17" text-anchor="middle" class="mono" font-size="11" fill="#D4D4D8">Data Analysis</text>
    </g>
  </g>

  <!-- Right Minimal Telemetry Panel (Black, White & Green curve only) -->
  <g transform="translate(620, 42)">
    <rect x="0" y="0" width="332" height="196" rx="14" fill="#090909" stroke="#1F1F1F" stroke-width="1"/>

    <text x="22" y="32" class="mono" font-size="10" fill="#71717A" letter-spacing="1.2">ANALYTICS &amp; ML PIPELINE</text>
    <circle cx="308" cy="28" r="3.5" fill="#22C55E" class="pulse-dot"/>

    <text x="22" y="58" class="sans" font-size="20" font-weight="600" fill="#FFFFFF" letter-spacing="-0.4">Data &amp; Quantitative ML</text>
    <text x="22" y="77" class="mono" font-size="11" fill="#A1A1AA">SQL · Pandas · Gradient Boosting</text>

    <!-- Subtle horizontal grid lines inside panel -->
    <line x1="22" y1="104" x2="310" y2="104" stroke="#18181B" stroke-width="1"/>
    <line x1="22" y1="134" x2="310" y2="134" stroke="#18181B" stroke-width="1"/>
    <line x1="22" y1="164" x2="310" y2="164" stroke="#18181B" stroke-width="1"/>

    <!-- Green Area + Animated Green Curve -->
    <path d="M 22 158 C 65 154, 95 142, 135 136 C 175 130, 205 112, 245 104 C 272 98, 292 88, 310 82 L 310 168 L 22 168 Z" fill="url(#greenArea)"/>
    <path d="M 22 158 C 65 154, 95 142, 135 136 C 175 130, 205 112, 245 104 C 272 98, 292 88, 310 82" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" class="curve-line"/>
    <circle cx="310" cy="82" r="3.5" fill="#22C55E" class="pulse-dot"/>
  </g>
</svg>
