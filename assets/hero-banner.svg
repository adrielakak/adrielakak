<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="50%" stop-color="#0F1015" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.18" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F4F4F6" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2997FF" />
      <stop offset="50%" stop-color="#64D2FF" />
      <stop offset="100%" stop-color="#5E5CE6" />
    </linearGradient>

    <radialGradient id="glowLeft" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#2997FF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#2997FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="85%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#5E5CE6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#5E5CE6" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.03" />
    </pattern>

    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.65; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes statusPulse {
        0%, 100% { opacity: 1; r: 4px; }
        50% { opacity: 0.45; r: 5.5px; }
      }
      @keyframes shimmerLine {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatBar1 {
        0%, 100% { height: 28px; y: 182px; }
        50% { height: 44px; y: 166px; }
      }
      @keyframes floatBar2 {
        0%, 100% { height: 48px; y: 162px; }
        50% { height: 32px; y: 178px; }
      }
      @keyframes floatBar3 {
        0%, 100% { height: 38px; y: 172px; }
        50% { height: 58px; y: 152px; }
      }
      @keyframes floatBar4 {
        0%, 100% { height: 62px; y: 148px; }
        50% { height: 46px; y: 164px; }
      }
      @keyframes floatBar5 {
        0%, 100% { height: 52px; y: 158px; }
        50% { height: 70px; y: 140px; }
      }
      @keyframes floatBar6 {
        0%, 100% { height: 74px; y: 136px; }
        50% { height: 60px; y: 150px; }
      }
      .ambient-glow {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: center;
      }
      .status-dot {
        animation: statusPulse 2.4s ease-in-out infinite;
      }
      .telemetry-curve {
        stroke-dasharray: 600;
        animation: shimmerLine 5s ease-in-out infinite alternate;
      }
      .bar-1 { animation: floatBar1 3.6s ease-in-out infinite; }
      .bar-2 { animation: floatBar2 4.2s ease-in-out infinite; }
      .bar-3 { animation: floatBar3 3.2s ease-in-out infinite; }
      .bar-4 { animation: floatBar4 4.6s ease-in-out infinite; }
      .bar-5 { animation: floatBar5 3.8s ease-in-out infinite; }
      .bar-6 { animation: floatBar6 4.0s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Main Apple Dark Card Container -->
  <rect x="2" y="2" width="996" height="316" rx="24" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="996" height="316" rx="24" fill="url(#grid)" />
  <rect x="2" y="2" width="996" height="316" rx="24" fill="url(#glowLeft)" class="ambient-glow" />
  <rect x="2" y="2" width="996" height="316" rx="24" fill="url(#glowRight)" class="ambient-glow" />
  <rect x="2" y="2" width="996" height="316" rx="24" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Top Specular Highlight -->
  <line x1="60" y1="2.5" x2="940" y2="2.5" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1" />

  <!-- macOS Window Subtle Traffic Lights & Header Bar -->
  <circle cx="40" cy="34" r="5" fill="#FF5F56" fill-opacity="0.85" />
  <circle cx="58" cy="34" r="5" fill="#FFBD2E" fill-opacity="0.85" />
  <circle cx="76" cy="34" r="5" fill="#27C93F" fill-opacity="0.85" />

  <!-- Status Pill -->
  <rect x="104" y="21" width="388" height="26" rx="13" fill="#1C1C22" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
  <circle cx="120" cy="34" r="4" fill="#30D158" class="status-dot" />
  <text x="134" y="38" fill="#E5E5EA" font-size="11.5" font-weight="500" letter-spacing="0.2" class="font-sans">
    Centrale Nantes × Audencia  ·  Shenzhen University
  </text>

  <!-- Left Content Column -->
  <text x="48" y="106" fill="url(#titleGrad)" font-size="44" font-weight="700" letter-spacing="-1.2" class="font-sans">
    Adriel Kourlate
  </text>

  <text x="48" y="142" fill="url(#accentBlue)" font-size="18.5" font-weight="600" letter-spacing="-0.2" class="font-sans">
    Data Science, Quantitative ML &amp; AI Engineering
  </text>

  <text x="48" y="178" fill="#A1A1AA" font-size="14" font-weight="400" class="font-sans">
    Dual-degree Engineering &amp; Management student building predictive ML pipelines,
  </text>
  <text x="48" y="200" fill="#A1A1AA" font-size="14" font-weight="400" class="font-sans">
    explainable financial risk systems, and real-time intelligent applications.
  </text>

  <!-- Bottom Feature Pills -->
  <g transform="translate(48, 238)">
    <rect x="0" y="0" width="166" height="36" rx="10" fill="#141419" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1" />
    <circle cx="18" cy="18" r="4" fill="#2997FF" />
    <text x="30" y="22" fill="#F4F4F6" font-size="12" font-weight="500" class="font-sans">Machine Learning</text>

    <rect x="178" y="0" width="174" height="36" rx="10" fill="#141419" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1" />
    <circle cx="196" cy="18" r="4" fill="#64D2FF" />
    <text x="208" y="22" fill="#F4F4F6" font-size="12" font-weight="500" class="font-sans">Quantitative Data</text>

    <rect x="364" y="0" width="176" height="36" rx="10" fill="#141419" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1" />
    <circle cx="382" cy="18" r="4" fill="#5E5CE6" />
    <text x="394" y="22" fill="#F4F4F6" font-size="12" font-weight="500" class="font-sans">Full-Stack &amp; AI</text>
  </g>

  <!-- Right Apple-Dark Live Telemetry Widget -->
  <g transform="translate(650, 46)">
    <rect x="0" y="0" width="304" height="228" rx="18" fill="#121318" fill-opacity="0.9" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
    <line x1="24" y1="0.5" x2="280" y2="0.5" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />

    <text x="22" y="30" fill="#8E8E93" font-size="10.5" font-weight="600" letter-spacing="1" class="font-mono">
      DATA &amp; AI PIPELINE TELEMETRY
    </text>
    <circle cx="278" cy="26" r="3.5" fill="#2997FF" class="status-dot" />

    <!-- Animated Signal Bars -->
    <rect x="28" y="182" width="18" height="28" rx="4" fill="#1E293B" class="bar-1" />
    <rect x="56" y="162" width="18" height="48" rx="4" fill="#1E3A5F" class="bar-2" />
    <rect x="84" y="172" width="18" height="38" rx="4" fill="#1D4ED8" fill-opacity="0.65" class="bar-3" />
    <rect x="112" y="148" width="18" height="62" rx="4" fill="#2563EB" fill-opacity="0.8" class="bar-4" />
    <rect x="140" y="158" width="18" height="52" rx="4" fill="#2997FF" fill-opacity="0.9" class="bar-5" />
    <rect x="168" y="136" width="18" height="74" rx="4" fill="url(#accentBlue)" class="bar-6" />

    <!-- Smooth Predictive Spline Curve -->
    <path d="M 24 122 C 68 118, 95 92, 138 96 C 180 100, 212 58, 278 48"
          fill="none" stroke="url(#accentBlue)" stroke-width="2.5" stroke-linecap="round" class="telemetry-curve" />

    <circle cx="278" cy="48" r="4.5" fill="#64D2FF" />

    <!-- Metrics Readout -->
    <text x="22" y="64" fill="#FFFFFF" font-size="22" font-weight="700" letter-spacing="-0.5" class="font-sans">
      Predictive ML
    </text>
    <text x="22" y="84" fill="#64D2FF" font-size="11.5" font-weight="500" class="font-mono">
      LightGBM · SHAP · NEAT · SQL
    </text>

    <!-- Mini Card Badge right side -->
    <rect x="200" y="142" width="84" height="68" rx="10" fill="#181920" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
    <text x="212" y="164" fill="#8E8E93" font-size="9.5" font-weight="600" class="font-mono">FOCUS</text>
    <text x="212" y="183" fill="#FFFFFF" font-size="13" font-weight="700" class="font-sans">Data &amp; AI</text>
    <text x="212" y="198" fill="#30D158" font-size="10" font-weight="600" class="font-mono">Production</text>
  </g>
</svg>
